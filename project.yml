name: Marionette
options:
  bundleIdPrefix: llc.turing
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # The OpenSSL xcframework under Packages/COpenSSL has no x86_64 simulator slice, so the simulator
    # build is Apple silicon only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  MarionetteKit:
    path: Packages/MarionetteKit
  RemoteDesktopCore:
    path: Packages/RemoteDesktopCore
  RemoteDesktopInteraction:
    path: Packages/RemoteDesktopInteraction
  RemoteDesktopMedia:
    path: Packages/RemoteDesktopMedia
targets:
  Marionette:
    type: application
    platform: iOS
    sources:
      - path: App/Marionette
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - package: MarionetteKit
      - package: RemoteDesktopCore
        product: RemoteDesktopCore
      - package: RemoteDesktopInteraction
      - package: RemoteDesktopMedia
        product: RemoteDesktopRender
    info:
      path: App/Marionette/Info.plist
      properties:
        CFBundleDisplayName: Marionette
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Copyright © 2026 Turing Software, LLC"
        NSLocalNetworkUsageDescription: "Marionette uses the local network to find computers near you and to connect to them."
        NSBonjourServices:
          - _rfb._tcp
          - _ssh._tcp
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: llc.turing.Marionette
        PRODUCT_NAME: Marionette
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A PROVISIONING_PROFILE passed to xcodebuild would also be applied to the packages' resource
        # bundles, which take none, so command-line builds pass MARIONETTE_PROVISIONING_PROFILE instead.
        PROVISIONING_PROFILE: $(MARIONETTE_PROVISIONING_PROFILE)
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  MarionetteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/MarionetteUITests
    dependencies:
      - target: Marionette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: llc.turing.Marionette.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Marionette
schemes:
  Marionette:
    build:
      targets:
        Marionette: all
        MarionetteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarionetteUITests
